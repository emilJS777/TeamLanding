apiVersion: v1
kind: Namespace
metadata:
  name: team-landing
  labels:
    app.kubernetes.io/name: team-landing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-landing-nginx
  namespace: team-landing
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;

    events {
      worker_connections 256;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      sendfile on;
      keepalive_timeout 65;
      include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /srv/site/current;
      index index.html;

      charset utf-8;
      server_tokens off;

      location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-landing
  namespace: team-landing
  labels:
    app.kubernetes.io/name: team-landing
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: team-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: team-landing
    spec:
      containers:
        - name: nginx
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Never
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-config
          configMap:
            name: team-landing-nginx
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: team-landing
  namespace: team-landing
  labels:
    app.kubernetes.io/name: team-landing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: team-landing
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-landing-api
  namespace: team-landing
data:
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: deneonofficial@gmail.com
  PROJECT_INQUIRY_RECIPIENT: deneonofficial@gmail.com
  CONTACT_MESSAGE_RECIPIENT: deneonofficial@gmail.com
  PROJECT_INQUIRY_FROM: "DENeon Team <deneonofficial@gmail.com>"
  ALLOWED_ORIGINS: "https://team.deneon.net,https://www.team.deneon.net"
  PROJECT_INQUIRY_RATE_LIMIT: "5"
  CONTACT_MESSAGE_RATE_LIMIT: "8"
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-landing-api
  namespace: team-landing
  labels:
    app.kubernetes.io/name: team-landing-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: team-landing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: team-landing-api
    spec:
      containers:
        - name: api
          image: __API_IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: team-landing-api
            - secretRef:
                name: team-landing-smtp
                optional: false
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              cpu: 200m
              memory: 160Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: team-landing-api
  namespace: team-landing
spec:
  selector:
    app.kubernetes.io/name: team-landing-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: team-landing
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-landing
  namespace: team-landing
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: team-landing-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: team.deneon.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: team-landing-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: team-landing
                port:
                  number: 80
  tls:
    - hosts:
        - team.deneon.net
      secretName: team-landing-tls
