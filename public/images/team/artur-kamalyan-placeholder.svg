<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Artur Kamalyan initials avatar</title>
  <desc id="description">AK initials on a dark navy background with a cyan, blue and teal gradient.</desc>
  <defs>
    <linearGradient id="background" x1="88" y1="70" x2="714" y2="736" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071724"/>
      <stop offset="0.52" stop-color="#06101D"/>
      <stop offset="1" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="accent" x1="178" y1="132" x2="650" y2="672" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30ECF4"/>
      <stop offset="0.48" stop-color="#168FE8"/>
      <stop offset="1" stop-color="#18C6A7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(400 390) rotate(90) scale(330)">
      <stop stop-color="#21D4E8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#21D4E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#background)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <path d="M80 245V104a24 24 0 0 1 24-24h141M555 80h141a24 24 0 0 1 24 24v141M720 555v141a24 24 0 0 1-24 24H555M245 720H104a24 24 0 0 1-24-24V555" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
  <circle cx="400" cy="400" r="244" fill="#071522" fill-opacity="0.74" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="400" cy="400" r="222" fill="none" stroke="#21D4E8" stroke-opacity="0.18"/>
  <text x="400" y="470" text-anchor="middle" fill="url(#accent)" filter="url(#soft-glow)" font-family="Manrope, Inter, Arial, sans-serif" font-size="206" font-weight="800" letter-spacing="-10">AK</text>
  <circle cx="119" cy="119" r="5" fill="#30ECF4"/>
  <circle cx="681" cy="681" r="5" fill="#18C6A7"/>
</svg>
